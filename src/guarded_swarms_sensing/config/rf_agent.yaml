# Passive RF monitoring consultant agent.
#
# Omnidirectional: coverage is a plain range test. Detects only transmitting
# targets, so a silent target (intruder transmitting:=false) is invisible here,
# which is the radio-silence counterfactual of Section 5.3.
/**:
  ros__parameters:
    use_sim_time: true

    pos_x: -150.0
    pos_y: -158.0
    pos_z: 28.0
    max_range_m: 320.0

    centre_freq_hz: 2.44e9
    bandwidth_hz: 2.0e7
    tx_power_dbm: 20.0

    detection_prob: 0.9
    false_positive_hz: 0.0
    latency_s: 0.3
    ttl_s: 3.0
    update_rate_hz: 4.0
    confidence: 0.7

    target_ids: ["intruder"]
    ground_truth_topics: ["/intruder/ground_truth"]
    transmitting_topics: ["/intruder/transmitting"]
