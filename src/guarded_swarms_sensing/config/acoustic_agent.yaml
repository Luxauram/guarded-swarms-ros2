# Acoustic buoy network consultant agent.
#
# Buoys sit in the water near the shore, so coverage is short range and sea
# only: an inland ingress is inaudible. Emits BEARING, not position.
/**:
  ros__parameters:
    use_sim_time: true

    # Inner ring of buoys, flattened x,y,x,y,... (world ENU)
    buoy_positions: [-130.0, 72.0, -70.0, 64.0, -10.0, 76.0, 55.0, 66.0, 120.0, 70.0]
    max_range_m: 90.0

    bearing_noise_deg: 4.0
    range_noise_m: 12.0
    detection_prob: 0.85
    latency_s: 0.5
    ttl_s: 3.0
    update_rate_hz: 3.0
    confidence: 0.6

    target_ids: ["intruder"]
    ground_truth_topics: ["/intruder/ground_truth"]
