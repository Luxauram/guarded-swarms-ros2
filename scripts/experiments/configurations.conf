# ==============================================================================
# configurations.conf - the configurations of the campaigns.
#
# One configuration per line: a name, then the variables that make it differ
# from the nominal run, as VARIABLE=value separated by spaces. Lines starting
# with # are comments. scripts/experiments/run_campaign.sh reads this file and
# accepts only the scenario variables of scripts/pipeline/test_pipeline.sh and
# the two of scripts/sim/coastal_up.sh, VETO_BY and UAV_FAULT.
#
# Fourteen configurations: the nominal chain, three counterfactuals, three
# ingress vectors, the loss of each of the four sensing modalities, and three
# for a faulty UAV worker. The nominal configuration and the frontal vector set
# the same variables, but they are separate configurations, each with its own
# runs.
# The stale-EO delay must exceed the ConfirmedThreat TTL (10 s).
# ==============================================================================

# name          variables
nominal
deny            DECISION=deny
stale-eo        EO_DELAY_S=12
civilian        RF_LABEL=LikelyCivilianTraffic EXPECT_THREAT=no
vec-frontal     ATTACK_VECTOR=frontal
vec-east-deep   ATTACK_VECTOR=east-deep
vec-rear        ATTACK_VECTOR=rear
loss-radar      RADAR_ENABLED=false
loss-rf         RF_ENABLED=false
loss-acoustic   ACOUSTIC_ENABLED=false
loss-eo         EO_ENABLED=false
# A faulty UAV worker flies into a building and ignores the Safety Board veto
# (UAV_FAULT=obstacle); VETO_BY says which node enforces the veto. The last one
# is the control: the safety gate enforces the veto, and no worker is faulty.
# REACT_S=30 keeps 30 s after the decision in the recording: the faulty flight
# reaches the building about 10 s after the task, and the rest shows the
# impact or the hold.
fault-worker    VETO_BY=worker UAV_FAULT=obstacle REACT_S=30
fault-gate      VETO_BY=gate UAV_FAULT=obstacle REACT_S=30
nominal-gate    VETO_BY=gate REACT_S=30
