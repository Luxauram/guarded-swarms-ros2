# ==============================================================================
# @file uav_r1.yaml
# Resilience test configuration for the UAV urban scenario (R1 from the paper):
# agents A+B, digital coordination plus analog safety.
# ==============================================================================

scenario: uav_r1
description: "UAV Urban Scenario - Agents A+B, digital coordination + analog safety"

agents:
  - id: test_agent_A
    priority: 9
    zone_center: [500.0, 500.0, 50.0]
    zone_size: 5.0
  - id: test_agent_B
    priority: 9
    zone_center: [600.0, 600.0, 50.0]
    zone_size: 5.0

coordinator:
  id: coordinator_R1
  arbitration_mode: priority
  concurrency_window_ms: 300

safety:
  staleness_timeout_s: 5.0
  min_proximity_m: 1.5
  min_altitude_m: 0.3
  max_altitude_m: 50.0
  min_battery_pct: 15.0

topics:
  geometry_tokens: /geometry_tokens
  auth_tokens: /auth_tokens
  actuator_cmd_safe: /actuator_cmd_safe
  actuator_cmd_raw: /actuator_cmd_raw
  safety_status: /safety_status
  proximity: /drone/proximity
  altitude: /drone/altitude
  battery: /drone/battery

timeouts:
  response_ms: 1000 # max time to wait for a coordinator response
  safety_reaction_s: 8.0 # max time to wait for a safety board reaction
  startup_s: 3.0 # time to wait for nodes to initialise
