# ==============================================================================
# @file mock.yaml
# Resilience test configuration for the mock pipeline (no PX4, no Gazebo).
# Fast path for CI-style testing without hardware simulation.
# ==============================================================================

scenario: mock
description: "Mock pipeline - Safety Board alone, no PX4 or Gazebo required"

# The limits of safety_board_node that the tests rely on: its defaults, which
# mock_pipeline.launch.py runs.
safety:
  staleness_timeout_s: 2.0
  min_proximity_m: 1.5

topics:
  imu: /drone/imu
  actuator_cmd_safe: /actuator_cmd_safe
  actuator_cmd_raw: /actuator_cmd_raw
  safety_status: /safety_status
  proximity: /drone/proximity
  altitude: /drone/altitude
  battery: /drone/battery

# Wait before the first phase of each test, s.
timeouts:
  startup_s: 8.0
