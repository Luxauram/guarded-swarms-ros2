# ==============================================================================
# @file mock.yaml
# Resilience test configuration for mock pipeline (no PX4, no Gazebo)
# Use this for fast CI/CD testing without hardware simulation.
# ==============================================================================

scenario: mock
description: "Mock pipeline - all 4 agents, no PX4 or Gazebo required"

# All 4 agents
agents:
  - id: test_agent_A
    priority: 5
    zone_center: [0.0, 0.0, 5.0]
    zone_size: 10.0
  - id: test_agent_B
    priority: 5
    zone_center: [15.0, 0.0, 5.0]
    zone_size: 10.0
  - id: test_agent_C
    priority: 5
    zone_center: [0.0, 15.0, 5.0]
    zone_size: 10.0
  - id: test_agent_D
    priority: 5
    zone_center: [15.0, 15.0, 5.0]
    zone_size: 10.0

coordinator:
  id: coordinator_mock
  arbitration_mode: priority
  concurrency_window_ms: 300

safety:
  staleness_timeout_s: 5.0
  min_proximity_m: 1.5
  min_altitude_m: 0.3
  max_altitude_m: 50.0
  min_battery_pct: 15.0

topics:
  geometry_tokens: /geometry_tokens
  auth_tokens: /auth_tokens
  actuator_cmd_safe: /actuator_cmd_safe
  actuator_cmd_raw: /actuator_cmd_raw
  safety_status: /safety_status
  proximity: /drone/proximity
  altitude: /drone/altitude
  battery: /drone/battery

timeouts:
  response_ms: 1000
  safety_reaction_s: 8.0
  startup_s: 8.0
