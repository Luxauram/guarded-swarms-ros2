# ==============================================================================
# @file ugv_r2.yaml
# Resilience test configuration for the UGV urban scenario (R2 from the paper):
# agents C+D, digital coordination plus analog safety. The altitude envelope is
# disabled, since a ground rover has no meaningful altitude bound.
# ==============================================================================

scenario: ugv_r2
description: "UGV Urban Scenario - Agents C+D, digital coordination + analog safety"

agents:
  - id: test_agent_A
    priority: 9
    zone_center: [500.0, 500.0, 0.0]
    zone_size: 5.0
  - id: test_agent_B
    priority: 9
    zone_center: [600.0, 600.0, 0.0]
    zone_size: 5.0

coordinator:
  id: coordinator_R2
  arbitration_mode: priority
  concurrency_window_ms: 300

safety:
  staleness_timeout_s: 5.0
  min_proximity_m: 1.5
  min_altitude_m: -1.0 # disabled for the UGV (ground level)
  max_altitude_m: 999.0 # disabled for the UGV (ground level)
  min_battery_pct: 15.0

topics:
  geometry_tokens: /geometry_tokens
  auth_tokens: /auth_tokens
  actuator_cmd_safe: /actuator_cmd_safe
  actuator_cmd_raw: /actuator_cmd_raw
  safety_status: /safety_status
  proximity: /drone/proximity
  altitude: /drone/altitude
  battery: /drone/battery

timeouts:
  response_ms: 1000
  safety_reaction_s: 8.0
  startup_s: 6.0
