services:
  guarded_swarms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: guarded_swarms_dev
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - ../src:/workspace/src
      - ros2_build:/workspace/build
      - ros2_install:/workspace/install
      - ros2_log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - QT_X11_NO_MITSHM=1
    command: /bin/bash

volumes:
  ros2_build:
  ros2_install:
  ros2_log:
