# Guarded Swarms - Docker Compose (Standard)
#
# SUPPORTED PLATFORM: Ubuntu 22.04 (native or dual boot) only.
#
# This project requires direct OpenGL/GPU access for Gazebo Harmonic.
# Docker on Windows (WSL2) and macOS cannot reliably provide this,
# resulting in broken Gazebo rendering and missing lidar sensor data.
#
# Usage:
#   make docker-start
#
# For NVIDIA GPU support (required for lidar sensors):
#   make docker-start-nvidia   →  uses docker-compose.nvidia.yml override

services:
  guarded_swarms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: guarded_swarms:latest
    container_name: guarded_swarms
    stdin_open: true
    tty: true
    ports:
      - '${DASHBOARD_PORT:-8765}:8765'
    volumes:
      - ../src:/workspace/src
      - ros2_build:/workspace/build
      - ros2_install:/workspace/install
      - ros2_log:/workspace/log
      # X11 socket - Linux only (set by: xhost +local:docker)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - QT_X11_NO_MITSHM=1
      # Software rendering fallback (no GPU).
      # Gazebo will start but lidar sensors will not publish data.
      # Use docker-compose.nvidia.yml for hardware-accelerated rendering.
      - LIBGL_ALWAYS_INDIRECT=0
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
    command: /bin/bash

volumes:
  ros2_build:
  ros2_install:
  ros2_log:
