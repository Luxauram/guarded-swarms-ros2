services:
  guarded_swarms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: guarded_swarms:latest
    container_name: guarded_swarms
    stdin_open: true
    tty: true
    # network_mode: host
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    volumes:
      - ../src:/workspace/src
      - ros2_build:/workspace/build
      - ros2_install:/workspace/install
      - ros2_log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      # Windows: DISPLAY=host.docker.internal:0.0
      # Linux: DISPLAY=:0
      # macOS: DISPLAY=<your-ip>:0
      - DISPLAY=host.docker.internal:0.0
      - ROS_DOMAIN_ID=42
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastrtps_profile.xml
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe

    command: /bin/bash

volumes:
  ros2_build:
  ros2_install:
  ros2_log:
