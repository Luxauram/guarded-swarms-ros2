name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The linters of Ubuntu 22.04, the versions a development machine has:
  # clang-format 14, flake8 4 and shellcheck 0.8. Each check fails the job.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install the linters
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git clang-format flake8 shellcheck

      - name: Checkout
        uses: actions/checkout@v6

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: C++ format (clang-format, .clang-format)
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0r clang-format --dry-run --Werror

      - name: Python errors (flake8, .flake8)
        run: git ls-files -z '*.py' | xargs -0r flake8

      - name: Shell scripts (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0r shellcheck -S warning

      - name: Text files end with a newline
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if [ -f "$f" ] && grep -Iq . "$f" && [ -n "$(tail -c1 "$f")" ]; then
              echo "no newline at the end: $f"
              status=1
            fi
          done < <(git ls-files -z)
          exit $status

  # Builds the workspace on ROS 2 Humble and runs the Safety Board tests on
  # the mock pipeline. No simulation: PX4 and Gazebo are not installed, so
  # rosdep skips the Gazebo bridge packages.
  build-test:
    name: Build and test (ROS 2 Humble)
    runs-on: ubuntu-latest
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install the dependencies (rosdep)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends procps
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys "ros_gz_sim ros_gz_bridge"

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Safety Board tests (mock pipeline)
        run: make test-resilience-mock

      - name: Mock pipeline log
        if: failure()
        run: cat /tmp/mock_pipeline.log || true
